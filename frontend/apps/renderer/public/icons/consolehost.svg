<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Terminal Body -->
  <rect x="15" y="15" width="90" height="75" rx="10" ry="10" fill="url(#terminalGrad)" stroke="#2d5a87" stroke-width="2"/>
  
  <!-- Terminal Screen -->
  <rect x="22" y="30" width="76" height="53" rx="5" ry="5" fill="url(#screenGrad)"/>
  
  <!-- Terminal Title Bar -->
  <rect x="15" y="15" width="90" height="15" rx="10" ry="10" fill="#2d5a87"/>
  <rect x="15" y="25" width="90" height="7" fill="#2d5a87"/>
  
  <!-- Window Buttons -->
  <circle cx="28" cy="22" r="4" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="52" cy="22" r="4" fill="#28ca41"/>
  
  <!-- Terminal Text Lines -->
  <text x="28" y="46" font-family="Monaco, monospace" font-size="9" fill="#00d9ff">PS&gt;</text>
  <rect x="50" y="40" width="42" height="6" rx="1" fill="#4a9eff" opacity="0.6"/>
  
  <text x="28" y="58" font-family="Monaco, monospace" font-size="9" fill="#00d9ff">PS&gt;</text>
  <rect x="50" y="52" width="35" height="6" rx="1" fill="#4a9eff" opacity="0.5"/>
  
  <text x="28" y="70" font-family="Monaco, monospace" font-size="9" fill="#00d9ff">PS&gt;</text>
  <rect x="50" y="64" width="28" height="6" rx="1" fill="#4a9eff" opacity="0.4"/>
  
  <!-- Cursor -->
  <rect x="28" y="75" width="8" height="3" fill="#00d9ff"/>
  
</svg>