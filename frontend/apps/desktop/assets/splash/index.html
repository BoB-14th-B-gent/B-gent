<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>B-Gent</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #111827;
        height: 100vh; display: grid; place-items: center;
        color: white; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .spinner { width: 20px; height: 20px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.25); border-top-color: white;
        animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      img { opacity: .95 }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="../logo.svg" width="120" height="120" alt="B-Gent" />
      <div class="spinner"></div>
      <h1>B-GENT</h1>
    </div>
  </body>
</html>
